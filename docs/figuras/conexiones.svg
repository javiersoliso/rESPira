<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="620" fill="#FBFBF9"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1F3A5F">rESPira · esquema de conexiones</text>
  <text x="40" y="70" font-size="13" fill="#666">ESP32 DevKitC · MAX30102 (fotopletismografía) · potenciómetro lineal de 10 kΩ (cinturón respiratorio)</text>

  <!-- ================= ESP32 ================= -->
  <rect x="70" y="120" width="215" height="360" rx="10" fill="#25303B" stroke="#16202A" stroke-width="2"/>
  <rect x="118" y="128" width="119" height="44" rx="4" fill="#3A4854"/>
  <text x="177" y="156" font-size="12" fill="#C9D6E2" text-anchor="middle">USB</text>
  <text x="177" y="308" font-size="15" font-weight="700" fill="#F2F5F8" text-anchor="middle">ESP32</text>
  <text x="177" y="327" font-size="12" fill="#9FB2C4" text-anchor="middle">DevKitC</text>
  <text x="177" y="351" font-size="11" fill="#7E93A6" text-anchor="middle">alimentación por USB</text>
  <text x="177" y="367" font-size="11" fill="#7E93A6" text-anchor="middle">o batería</text>

  <!-- pines derechos -->
  <g font-size="12" fill="#DCE6EF" text-anchor="end">
    <circle cx="285" cy="160" r="5" fill="#C1440E"/><text x="272" y="164">3V3</text>
    <circle cx="285" cy="190" r="5" fill="#8A8A8A"/><text x="272" y="194">GND</text>
    <circle cx="285" cy="220" r="5" fill="#3E6B9E"/><text x="272" y="224">D22 · SCL</text>
    <circle cx="285" cy="250" r="5" fill="#2E7D6F"/><text x="272" y="254">D21 · SDA</text>
    <circle cx="285" cy="395" r="5" fill="#B8860B"/><text x="272" y="399">D25</text>
    <circle cx="285" cy="425" r="5" fill="#6A4C93"/><text x="272" y="429">D33 · ADC1_CH5</text>
    <circle cx="285" cy="455" r="5" fill="#5C6B7A"/><text x="272" y="459">D32</text>
  </g>

  <!-- ================= MAX30102 ================= -->
  <rect x="640" y="130" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="755" y="163" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">MAX30102</text>
  <text x="755" y="182" font-size="11" fill="#666" text-anchor="middle">IR 880 nm + rojo 660 nm · I²C</text>
  <rect x="700" y="196" width="110" height="52" rx="6" fill="#F0E5D8" stroke="#D8C4AE"/>
  <text x="755" y="227" font-size="11" fill="#8A6C4A" text-anchor="middle">ventana al dedo</text>
  <g font-size="12" fill="#25303B">
    <circle cx="640" cy="160" r="5" fill="#C1440E"/><text x="654" y="164">VIN</text>
    <circle cx="640" cy="190" r="5" fill="#8A8A8A"/><text x="654" y="194">GND</text>
    <circle cx="640" cy="220" r="5" fill="#3E6B9E"/><text x="654" y="224">SCL</text>
    <circle cx="640" cy="250" r="5" fill="#2E7D6F"/><text x="654" y="254">SDA</text>
  </g>
  <text x="866" y="272" font-size="10.5" fill="#999" text-anchor="end">INT → D19 · sin usar</text>

  <!-- ================= Potenciómetro ================= -->
  <rect x="640" y="330" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
  <text x="755" y="363" font-size="15" font-weight="700" fill="#1F3A5F" text-anchor="middle">Potenciómetro 10 kΩ</text>
  <text x="755" y="381" font-size="11" fill="#666" text-anchor="middle">lineal · acoplado al cinturón torácico</text>
  <line x1="742" y1="424" x2="852" y2="424" stroke="#B0B0B0" stroke-width="7" stroke-linecap="round"/>
  <polygon points="797,406 790,422 804,422" fill="#6A4C93"/>
  <text x="797" y="450" font-size="10" fill="#8A8A8A" text-anchor="middle">el cursor se desplaza</text>
  <text x="797" y="464" font-size="10" fill="#8A8A8A" text-anchor="middle">al expandirse el tórax</text>
  <g font-size="12" fill="#25303B">
    <circle cx="640" cy="395" r="5" fill="#B8860B"/><text x="654" y="399">riel alto</text>
    <circle cx="640" cy="425" r="5" fill="#6A4C93"/><text x="654" y="429">cursor</text>
    <circle cx="640" cy="455" r="5" fill="#5C6B7A"/><text x="654" y="459">riel bajo</text>
  </g>

  <!-- ================= Cables ================= -->
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M285 160 H 640" stroke="#C1440E"/>
    <path d="M285 190 H 640" stroke="#8A8A8A"/>
    <path d="M285 220 H 640" stroke="#3E6B9E"/>
    <path d="M285 250 H 640" stroke="#2E7D6F"/>
    <path d="M285 395 H 640" stroke="#B8860B"/>
    <path d="M285 425 H 640" stroke="#6A4C93"/>
    <path d="M285 455 H 640" stroke="#5C6B7A"/>
  </g>

  <!-- ================= Tabla ================= -->
  <text x="40" y="540" font-size="12" font-weight="700" fill="#1F3A5F">Resumen</text>
  <g font-size="11.5" fill="#3A3A3A">
    <text x="40" y="562">MAX30102 · VIN → 3V3 · GND → GND · SCL → D22 · SDA → D21 · INT → D19 (no se usa)</text>
    <text x="40" y="582">Potenciómetro · riel alto → D25 · cursor → D33 (ADC1_CH5) · riel bajo → D32</text>
    <text x="40" y="602" fill="#777">Los rieles del potenciómetro van a pines de propósito general, no a 3V3 y GND: así el firmware puede apagarlo y usar una referencia limpia.</text>
  </g>
</svg>
